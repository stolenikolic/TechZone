# Automatski noćni lanac — SAMO schedule (+ ručni "pokreni cijeli lanac" bez izbora joba).
# Pojedinačni jobovi: background-jobs.yml (workflow_dispatch).

name: Nightly pipeline

on:
  schedule:
    # 22:30 BiH (CEST, ljeti): 20:30 UTC → "30 20 * * *"
    # Zimi (CET, UTC+1): 22:30 = 21:30 UTC → promijeni u "30 21 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  ipon_import:
    name: "1a · iPon import"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: ipon_import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: echo "Triggered by ${{ github.event_name }} at $(date -u)"
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-import-products.ts

  pcx_import:
    name: "1b · PCX import"
    runs-on: ubuntu-latest
    # GHA hard cap is 360 min per job; was 45m and PCX full catalog was cancelled mid-run.
    timeout-minutes: 360
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: pcx_import
      # 0 = bez limita po runu (lokalno u .env.local; na GHA inače default 5)
      PCX_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-pcx-import-products.ts

  firstshop_import:
    name: "1c · FirstShop import"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: firstshop_import
      FIRSTSHOP_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-firstshop-import-products.ts

  pcland_import:
    name: "1d · PCLand import"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: pcland_import
      PCLAND_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-pcland-import-products.ts

  oazis_import:
    name: "1e · Oázis import"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: oazis_import
      OAZIS_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-oazis-import-products.ts

  konzolvilag_import:
    name: "1f · Konzolvilág import"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: konzolvilag_import
      KONZOLVILAG_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-konzolvilag-import-products.ts

  auto_match:
    name: "2 · Auto match"
    needs: [ipon_import, pcx_import, firstshop_import, pcland_import, oazis_import, konzolvilag_import]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: auto_match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-auto-match.ts

  aggregate_prices:
    name: "3 · Aggregate prices"
    needs: [auto_match]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: aggregate_prices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-aggregate-prices.ts

  ipon_scrape_details:
    name: "4 · iPon scrape details"
    needs: [aggregate_prices]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: ipon_scrape_details
      IPON_SCRAPE_UNTIL_EMPTY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-scrape-details.ts

  enrichment:
    name: "5 · Enrichment"
    needs: [ipon_scrape_details]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: enrichment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-enrichment.ts

  ai_descriptions:
    name: "6 · AI descriptions"
    needs: [enrichment]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: ai_descriptions
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/run-ai-descriptions.ts

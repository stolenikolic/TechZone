# Automatski noćni lanac — SAMO schedule (+ ručni "pokreni cijeli lanac" bez izbora joba).
# Pojedinačni jobovi: background-jobs.yml (workflow_dispatch).
# AI opisi nisu u lancu.
# Uvozi idu paralelno. Cijeli workflow čeka price-sync.yml ako je sync još u toku.
# Match i iPon RSC scrape kreću kad uvozi završe, paralelno.
# Cijene čekaju match. Enrichment čeka cijene i scrape, pa mapira specifikacije koje scrape stigne upisati.

name: Nightly pipeline

on:
  schedule:
    # 20:30 UTC. Ljeti (CEST) to je 22:30 BiH, zimi (CET) 21:30 BiH.
    - cron: "30 20 * * *"
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
  R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

concurrency:
  # Isti group kao price-sync.yml. Jedan čeka drugi, niko se ne gasi.
  # Uvozi unutar ovog workflowa i dalje kreću paralelno.
  group: nightly-price-sync
  cancel-in-progress: false
  queue: max

jobs:
  ipon_import:
    name: "1a · iPon import"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: ipon_import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-import-products.ts

  pcx_import:
    name: "1b · PCX import"
    runs-on: ubuntu-latest
    # GHA hard cap is 360 min per job; was 45m and PCX full catalog was cancelled mid-run.
    timeout-minutes: 360
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: pcx_import
      # 0 = bez limita po runu (lokalno u .env.local; na GHA inače default 5)
      PCX_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-pcx-import-products.ts

  firstshop_import:
    name: "1c · FirstShop import"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: firstshop_import
      FIRSTSHOP_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-firstshop-import-products.ts

  pcland_import:
    name: "1d · PCLand import"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: pcland_import
      PCLAND_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-pcland-import-products.ts

  oazis_import:
    name: "1e · Oázis import"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: oazis_import
      OAZIS_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-oazis-import-products.ts

  konzolvilag_import:
    name: "1f · Konzolvilág import"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: konzolvilag_import
      KONZOLVILAG_MAX_PRODUCTS_PER_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-konzolvilag-import-products.ts

  comtrade_import:
    name: "1g · ComTrade import"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: comtrade_import
      COMTRADE_USERNAME: ${{ secrets.COMTRADE_USERNAME }}
      COMTRADE_PASSWORD: ${{ secrets.COMTRADE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-comtrade-import-products.ts

  avtera_import:
    name: "1h · Avtera import"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: avtera_import
      AVTERA_XML_FEED_URL: ${{ secrets.AVTERA_XML_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-avtera-import-products.ts

  alza_import:
    name: "1i · Alza import"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: alza_import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r scripts/alza/requirements.txt
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-alza-import-products.ts

  auto_match:
    name: "2 · Auto match"
    needs: [ipon_import, pcx_import, firstshop_import, pcland_import, oazis_import, konzolvilag_import, comtrade_import, avtera_import, alza_import]
    if: ${{ !cancelled() && (needs.ipon_import.result == 'success' || needs.pcx_import.result == 'success' || needs.firstshop_import.result == 'success' || needs.pcland_import.result == 'success' || needs.oazis_import.result == 'success' || needs.konzolvilag_import.result == 'success' || needs.comtrade_import.result == 'success' || needs.avtera_import.result == 'success' || needs.alza_import.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: auto_match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-auto-match.ts

  ipon_scrape_details:
    name: "2b · iPon scrape details"
    needs: [ipon_import, pcx_import, firstshop_import, pcland_import, oazis_import, konzolvilag_import, comtrade_import, avtera_import, alza_import]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Isti group kao ipon-scrape-details.yml — ne jure paralelno isti iPon red.
    concurrency:
      group: ipon-scrape-details
      cancel-in-progress: false
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: ipon_scrape_details
      IPON_SCRAPE_UNTIL_EMPTY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-scrape-details.ts

  aggregate_prices:
    name: "3 · Aggregate prices"
    needs: [auto_match]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: aggregate_prices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-aggregate-prices.ts

  enrichment:
    name: "4 · Enrichment"
    needs: [aggregate_prices, ipon_scrape_details]
    if: ${{ !cancelled() && needs.aggregate_prices.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_TRIGGERED_BY: cron
      JOB_TYPE: enrichment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: pause
        continue-on-error: true
        run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - if: steps.pause.outcome == 'success'
        run: npx tsx -r ./scripts/register-ws.cjs scripts/run-enrichment.ts

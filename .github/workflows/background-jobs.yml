# Ručno pokretanje pojedinačnih jobova (admin test / popravka).
# Automatski noćni lanac: nightly-pipeline.yml (schedule).

name: Background jobs (manual)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Koji job pokrenuti"
        required: true
        type: choice
        options:
          - ipon_import
          - ipon_xml_sync
          - pcx_import
          - firstshop_import
          - pcland_import
          - oazis_import
          - konzolvilag_import
          - auto_match
          - aggregate_prices
          - ipon_scrape_details
          - enrichment
          - ai_descriptions

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

concurrency:
  group: background-jobs-manual-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_TRIGGERED_BY: manual
      JOB_TYPE: ${{ inputs.job }}
      IPON_SCRAPE_UNTIL_EMPTY: ${{ inputs.job == 'ipon_scrape_details' && '1' || '' }}
      PCX_MAX_PRODUCTS_PER_RUN: ${{ inputs.job == 'pcx_import' && '0' || '' }}
      FIRSTSHOP_MAX_PRODUCTS_PER_RUN: ${{ inputs.job == 'firstshop_import' && '0' || '' }}
      PCLAND_MAX_PRODUCTS_PER_RUN: ${{ inputs.job == 'pcland_import' && '0' || '' }}
      OAZIS_MAX_PRODUCTS_PER_RUN: ${{ inputs.job == 'oazis_import' && '0' || '' }}
      KONZOLVILAG_MAX_PRODUCTS_PER_RUN: ${{ inputs.job == 'konzolvilag_import' && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node --version
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      - run: |
          case "${{ inputs.job }}" in
            ipon_import) npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-import-products.ts ;;
            ipon_xml_sync) npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-xml-sync.ts ;;
            pcx_import) npx tsx -r ./scripts/register-ws.cjs scripts/run-pcx-import-products.ts ;;
            firstshop_import) npx tsx -r ./scripts/register-ws.cjs scripts/run-firstshop-import-products.ts ;;
            pcland_import) npx tsx -r ./scripts/register-ws.cjs scripts/run-pcland-import-products.ts ;;
            oazis_import) npx tsx -r ./scripts/register-ws.cjs scripts/run-oazis-import-products.ts ;;
            konzolvilag_import) npx tsx -r ./scripts/register-ws.cjs scripts/run-konzolvilag-import-products.ts ;;
            auto_match) npx tsx -r ./scripts/register-ws.cjs scripts/run-auto-match.ts ;;
            aggregate_prices) npx tsx -r ./scripts/register-ws.cjs scripts/run-aggregate-prices.ts ;;
            ipon_scrape_details) npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-scrape-details.ts ;;
            enrichment) npx tsx -r ./scripts/register-ws.cjs scripts/run-enrichment.ts ;;
            ai_descriptions) npx tsx -r ./scripts/register-ws.cjs scripts/run-ai-descriptions.ts ;;
            *) echo "Unknown job"; exit 1 ;;
          esac

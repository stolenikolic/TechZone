# iPon scrape details — periodični drain reda, odvojeno od nightly pipeline-a.
# Svakih ~90 min, max ~30 min po runu; sljedeći run nastavlja red.

name: iPon scrape details

on:
  schedule:
    # Svakih ~90 min (UTC): 00:00, 01:30, 03:00, 04:30, …
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
  R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
  JOB_TRIGGERED_BY: cron
  JOB_TYPE: ipon_scrape_details
  IPON_SCRAPE_UNTIL_EMPTY: "1"

concurrency:
  group: ipon-scrape-details
  cancel-in-progress: false

jobs:
  scrape:
    name: iPon scrape details
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: echo "Triggered by ${{ github.event_name }} at $(date -u)"
      - run: npx tsx -r ./scripts/register-ws.cjs scripts/check-job-paused.ts
      # Soft stop ~28 min (exit 124); GHA hard-kill na 30 min. Ne dira scrapeDetails.ts.
      - run: |
          set +e
          timeout 28m npx tsx -r ./scripts/register-ws.cjs scripts/run-ipon-scrape-details.ts
          code=$?
          if [ "$code" -eq 124 ]; then
            echo "Stopped after 28m time budget (queue continues on next run)."
            exit 0
          fi
          exit "$code"
